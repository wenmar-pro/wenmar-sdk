---
openapi: 3.0.0
info:
  title: Wenmar Pro API
  version: 1.0.0
servers: []
paths:
  "/account":
    get:
      summary: show
      tags:
      - Shop::Account
      responses:
        '200':
          description: GET /account -> 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  slug:
                    type: string
                  locations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        url:
                          type: string
                        app_url:
                          type: string
                      required:
                      - id
                      - name
                      - url
                      - app_url
                  url:
                    type: string
                  app_url:
                    type: string
                required:
                - id
                - name
                - slug
                - locations
                - url
                - app_url
        '403':
          description: GET /account -> 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      field_errors:
                        type: object
                        properties: {}
                    required:
                    - code
                    - message
                    - field_errors
                required:
                - error
      description: GET /account
  "/customer_tags":
    get:
      summary: index
      tags:
      - Shop::CustomerTag
      responses:
        '200':
          description: GET /customer_tags -> 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    color:
                      type: string
                    color_hex:
                      type: string
                    color_class:
                      type: string
                  required:
                  - id
                  - name
                  - color
                  - color_hex
                  - color_class
      description: GET /customer_tags
    post:
      summary: create
      tags:
      - Shop::CustomerTag
      responses:
        '201':
          description: POST /customer_tags -> 201
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  color:
                    type: string
                  color_hex:
                    type: string
                  color_class:
                    type: string
                required:
                - id
                - name
                - color
                - color_hex
        '403':
          description: POST /customer_tags -> 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      field_errors:
                        type: object
                        properties: {}
                    required:
                    - code
                    - message
                    - field_errors
                required:
                - error
        '422':
          description: POST /customer_tags -> 422
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      field_errors:
                        type: object
                        properties:
                          name:
                            type: array
                            items:
                              type: string
                        required:
                        - name
                    required:
                    - code
                    - message
                    - field_errors
                required:
                - error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
      description: POST /customer_tags
  "/customer_tags/{id}":
