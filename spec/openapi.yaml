---
openapi: 3.0.0
info:
  title: Wenmar Pro API
  version: 1.0.0
servers: []
paths:
  "/account":
    get:
      summary: show
      tags:
      - Shop::Account
      responses:
        '200':
          description: GET /account -> 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  slug:
                    type: string
                  locations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        url:
                          type: string
                      required:
                      - id
                      - name
                      - url
                  url:
                    type: string
                required:
                - id
                - name
                - slug
                - locations
                - url
        '403':
          description: GET /account -> 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties: {}
                    required:
                    - code
                    - message
                    - details
                required:
                - error
