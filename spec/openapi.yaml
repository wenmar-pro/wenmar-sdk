  "/customers":
    get:
      summary: index
      tags:
      - Shop::Customer
      responses:
        '200':
          description: GET /customers -> 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    id:
                      type: integer
                    full_name:
                      type: string
                    company_name:
                      nullable: true
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                    fleet_identifier:
                      nullable: true
                      type: string
                    marketing_opt_in:
                      type: boolean
                    tax_exempt:
                      type: boolean
                    vehicles_count:
                      type: integer
                    emails_count:
                      type: integer
                    phones_count:
                      type: integer
                    vehicles_url:
                      type: string
                    work_orders_url:
                      type: string
                    created_at:
                      type: string
                    updated_at:
                      type: string
                    url:
                      type: string
                    app_url:
                      type: string
                    location:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        url:
                          type: string
                      required:
                      - id
                      - name
                      - url
                  required:
                  - type
                  - id
                  - full_name
                  - company_name
                  - first_name
                  - last_name
                  - fleet_identifier
                  - marketing_opt_in
                  - tax_exempt
                  - vehicles_count
                  - emails_count
                  - phones_count
                  - vehicles_url
                  - work_orders_url
                  - created_at
                  - updated_at
                  - url
                  - app_url
                  - location
        '401':
          description: GET /customers -> 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      field_errors:
                        type: object
                        properties: {}
                    required:
                    - code
                    - message
                    - field_errors
                required:
                - error
      description: GET /customers
      parameters:
      - name: has_balance
        in: query
        required: false
        schema:
          type: boolean
      - name: has_vehicle
        in: query
        required: false
        schema:
          type: boolean
      - name: last_visit_months
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: tag_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
    post:
      summary: create
      tags:
      - Shop::Customer
      requestBody:
        content:
          application/json:
            schema:
              type: object
