                      - status
                      - intake_method
                      - scheduled_for
                      - authorized
                      - paid
                      - created_at
                      - updated_at
                      - closed_at
                      - location_id
                      - service_advisor_id
                      - assigned_technician_id
                      - work_order_services_count
                      - inspection_reports_count
                      - customer
                      - vehicle
                      - totals
                      - url
                      - app_url
                      - location
