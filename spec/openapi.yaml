        '201':
          description: POST /customers -> 201
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  id:
                    type: integer
                  full_name:
                    type: string
                  company_name:
                    nullable: true
                    type: string
                  first_name:
                    type: string
                  last_name:
                    type: string
                  fleet_identifier:
                    nullable: true
                    type: string
                  marketing_opt_in:
                    type: boolean
                  tax_exempt:
                    type: boolean
                  vehicles_count:
                    type: integer
                  emails_count:
                    type: integer
                  phones_count:
                    type: integer
                  vehicles_url:
                    type: string
                  work_orders_url:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  url:
                    type: string
                  app_url:
                    type: string
                  location:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      url:
                        type: string
                    required:
                    - id
                    - name
                    - url
                  emails:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        address:
                          type: string
                        label:
                          type: string
                        primary:
                          type: boolean
                      required:
                      - id
                      - address
                      - label
                      - primary
                  phones:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        number:
                          type: string
                        label:
                          type: string
                        primary:
                          type: boolean
                      required:
                      - id
                      - number
                      - label
                      - primary
                  addresses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        address1:
                          type: string
                        address2:
                          nullable: true
                        city:
                          type: string
                        state:
                          type: string
                        state_name:
                          type: string
                        postal_code:
                          type: string
                        country:
                          type: string
                        is_billing:
                          type: boolean
                        full_address:
                          type: string
                      required:
                      - id
                      - address1
                      - address2
                      - city
                      - state
                      - state_name
                      - postal_code
                      - country
                      - is_billing
                      - full_address
                  outstanding_balance_cents:
                    type: integer
                  total_revenue_cents:
                    type: integer
                  store_credit_cents:
                    type: integer
                  last_visit_at:
                    nullable: true
                  statements_count:
                    type: integer
                  currency:
                    type: string
                required:
                - type
                - id
                - full_name
                - company_name
                - first_name
                - last_name
                - fleet_identifier
                - marketing_opt_in
                - tax_exempt
                - vehicles_count
                - emails_count
                - phones_count
                - vehicles_url
                - work_orders_url
                - created_at
                - updated_at
                - url
                - app_url
                - location
                - emails
                - phones
                - addresses
                - outstanding_balance_cents
                - total_revenue_cents
                - store_credit_cents
                - last_visit_at
                - statements_count
                - currency
        '403':
          description: POST /customers -> 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      field_errors:
                        type: object
                        properties: {}
                    required:
                    - code
                    - message
                    - field_errors
                required:
                - error
        '422':
          description: POST /customers -> 422
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      field_errors:
                        type: object
                        properties:
                          first_name:
                            type: array
                            items:
                              type: string
                          company_name:
                            type: array
                            items:
                              type: string
                        required:
                        - first_name
                        - company_name
                    required:
                    - code
                    - message
                    - field_errors
                required:
                - error
      description: POST /customers
