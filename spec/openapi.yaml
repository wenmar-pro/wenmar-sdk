            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  color:
                    type: string
                  color_hex:
                    type: string
                  color_class:
                    type: string
                required:
                - id
                - name
                - color
                - color_hex
                - color_class
