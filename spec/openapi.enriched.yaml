---
openapi: 3.0.0
info:
  title: Wenmar Pro API
  version: 1.0.0
servers:
- url: https://app.wenmarpro.com
paths:
  "/account":
    get:
      summary: show
      tags:
      - account
      responses:
        '200':
          description: GET /account -> 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  slug:
                    type: string
                  locations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        url:
                          type: string
                        app_url:
                          type: string
                      required:
                      - id
                      - name
                      - url
                      - app_url
                  url:
                    type: string
                  app_url:
                    type: string
                required:
                - id
                - name
                - slug
                - locations
                - url
                - app_url
        '403':
          description: GET /account -> 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    "$ref": "#/components/schemas/Error"
                required:
                - error
      description: List all account, paginated via the Link header.
      operationId: list_account
      x-curl-example: 'curl -H "User-Agent: wenmar-cli/0.2" -H "Authorization: Bearer
        $WENMAR_TOKEN" https://app.wenmarpro.com/account.json'
      x-retry: &1
        max: 3
        backoff: exponential
        retry-on:
        - 429
        - 500
        - 502
        - 503
        - 504
        method-gated: true
  "/customers":
    get:
      summary: index
      tags:
      - customers
      responses:
        '200':
          description: GET /customers -> 200
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Customer"
        '401':
          description: GET /customers -> 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    "$ref": "#/components/schemas/Error"
                required:
                - error
      description: List all customers, paginated via the Link header.
      operationId: list_customers
      x-curl-example: 'curl -H "User-Agent: wenmar-cli/0.2" -H "Authorization: Bearer
        $WENMAR_TOKEN" https://app.wenmarpro.com/customers.json'
      x-paginated: true
      x-pagination-header: Link
      x-pagination-format: rfc5988
      x-retry: *1
    post:
      summary: create
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: object
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                  required:
                  - first_name
                  - last_name
              required:
              - customer
      responses:
        '201':
          description: POST /customers -> 201
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        '403':
          description: POST /customers -> 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    "$ref": "#/components/schemas/Error"
                required:
                - error
        '422':
          description: POST /customers -> 422
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    "$ref": "#/components/schemas/Error"
                required:
                - error
      description: Create a customer.
      operationId: create_customer
      x-curl-example: |-
        curl -X POST -H "User-Agent: wenmar-cli/0.2" -H "Authorization: Bearer $WENMAR_TOKEN" -H "Content-Type: application/json" \
             -d '{"...":"..."}' https://app.wenmarpro.com/customers.json
      x-idempotent: false
      x-retry: *1
  "/customers/{customer_id}/vehicles":
    get:
      summary: index
      tags:
      - customers
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: GET /customers/{customer_id}/vehicles -> 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    id:
                      type: integer
                    make:
                      type: string
                    model:
                      type: string
                    year:
                      type: integer
                    submodel:
                      nullable: true
                    body_style:
                      nullable: true
                    engine:
                      nullable: true
                    vin:
                      type: string
                    license_plate:
                      type: string
                    license_plate_state:
                      type: string
                    license_plate_country:
                      type: string
                    drivetrain:
                      nullable: true
                    transmission:
                      nullable: true
                    color:
                      nullable: true
                    vehicle_type:
                      type: string
                    unit_number:
                      nullable: true
                    fleet_identifier:
                      nullable: true
                    production_date:
                      nullable: true
                    annual_safety_expires_at:
                      nullable: true
                    notes:
                      nullable: true
                    odometer:
                      type: object
                      properties:
                        reading:
                          nullable: true
                        unit:
                          type: string
                      required:
                      - reading
                      - unit
                    work_orders_count:
                      type: integer
                    work_orders_url:
                      type: string
                    customer:
                      type: object
                      properties:
                        id:
                          type: integer
                        full_name:
                          type: string
                        url:
                          type: string
                      required:
                      - id
                      - full_name
                      - url
                    created_at:
                      type: string
                    updated_at:
                      type: string
                    url:
                      type: string
                    app_url:
                      type: string
                    location:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        url:
                          type: string
                      required:
                      - id
                      - name
                      - url
                  required:
                  - type
                  - id
                  - make
                  - model
                  - year
                  - submodel
                  - body_style
                  - engine
                  - vin
                  - license_plate
                  - license_plate_state
                  - license_plate_country
                  - drivetrain
                  - transmission
                  - color
                  - vehicle_type
                  - unit_number
                  - fleet_identifier
                  - production_date
                  - annual_safety_expires_at
                  - notes
                  - odometer
                  - work_orders_count
                  - work_orders_url
                  - customer
                  - created_at
                  - updated_at
                  - url
                  - app_url
                  - location
      description:
      operationId: get_customers_vehicle
      x-curl-example: 'curl -H "User-Agent: wenmar-cli/0.2" -H "Authorization: Bearer
        $WENMAR_TOKEN" https://app.wenmarpro.com/customers/{customer_id}/vehicles.json'
      x-retry: *1
  "/customers/{customer_id}/vehicles/{vehicle_id}/history":
    get:
      summary: show
      tags:
      - customers
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: integer
      - name: vehicle_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: GET /customers/{customer_id}/vehicles/{vehicle_id}/history
            -> 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_work_orders:
                    type: integer
                  work_orders:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        id:
                          type: integer
                        work_order_number:
                          type: integer
                        status:
                          type: string
                        intake_method:
                          type: string
                        scheduled_for:
                          nullable: true
                        authorized:
                          type: boolean
                        paid:
                          type: boolean
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        closed_at:
                          nullable: true
                        location_id:
                          type: integer
                        service_advisor_id:
                          nullable: true
                        assigned_technician_id:
                          nullable: true
                        work_order_services_count:
                          type: integer
                        inspection_reports_count:
                          type: integer
                        customer:
                          type: object
                          properties:
                            id:
                              type: integer
                            full_name:
                              type: string
                            url:
                              type: string
                          required:
                          - id
                          - full_name
                          - url
                        vehicle:
                          type: object
                          properties:
                            id:
                              type: integer
                            make:
                              type: string
                            model:
                              type: string
                            year:
                              type: integer
                            vin:
                              type: string
                            url:
                              type: string
                          required:
                          - id
                          - make
                          - model
                          - year
                          - vin
                          - url
                        totals:
                          type: object
                          properties:
                            subtotal_cents:
                              type: integer
                            tax_cents:
                              type: integer
                            total_cents:
                              type: integer
                            paid_cents:
                              type: integer
                            remaining_cents:
                              type: integer
                            currency:
                              type: string
                          required:
                          - subtotal_cents
                          - tax_cents
                          - total_cents
                          - paid_cents
                          - remaining_cents
                          - currency
                        url:
                          type: string
                        app_url:
                          type: string
                        location:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            url:
                              type: string
                          required:
                          - id
                          - name
                          - url
                      required:
                      - type
                      - id
                      - work_order_number
                      - status
                      - intake_method
                      - scheduled_for
                      - authorized
                      - paid
                      - created_at
                      - updated_at
                      - closed_at
                      - location_id
                      - service_advisor_id
                      - assigned_technician_id
                      - work_order_services_count
                      - inspection_reports_count
                      - customer
                      - vehicle
                      - totals
                      - url
                      - app_url
                      - location
                required:
                - total_work_orders
                - work_orders
        '404':
          description: GET /customers/{customer_id}/vehicles/{vehicle_id}/history
            -> 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    "$ref": "#/components/schemas/Error"
                required:
                - error
      description:
      operationId: get_customers_vehicle_history
      x-curl-example: 'curl -H "User-Agent: wenmar-cli/0.2" -H "Authorization: Bearer
        $WENMAR_TOKEN" https://app.wenmarpro.com/customers/{customer_id}/vehicles/{vehicle_id}/history.json'
      x-retry: *1
  "/customers/{customer_id}/work_orders":
    get:
      summary: index
