                      type: string
                    id:
                      type: integer
                    work_order_number:
                      type: integer
                    status:
                      type: string
                    intake_method:
                      type: string
                    scheduled_for:
                      nullable: true
                    authorized:
                      type: boolean
                    paid:
                      type: boolean
                    created_at:
                      type: string
                    updated_at:
                      type: string
                    closed_at:
                      nullable: true
                    location_id:
                      type: integer
                    service_advisor_id:
                      nullable: true
                    assigned_technician_id:
                      nullable: true
                    work_order_services_count:
                      type: integer
                    inspection_reports_count:
                      type: integer
                    customer:
                      type: object
                      properties:
                        id:
                          type: integer
                        full_name:
                          type: string
                        url:
                          type: string
                      required:
                      - id
                      - full_name
                      - url
                    vehicle:
                      type: object
                      properties:
                        id:
                          type: integer
                        make:
                          type: string
                        model:
                          type: string
                        year:
                          type: integer
                        vin:
                          type: string
                        url:
                          type: string
                      required:
                      - id
                      - make
                      - model
                      - year
                      - vin
                      - url
                    totals:
                      type: object
                      properties:
                        subtotal_cents:
                          type: integer
                        tax_cents:
                          type: integer
                        total_cents:
                          type: integer
                        paid_cents:
                          type: integer
                        remaining_cents:
                          type: integer
                        currency:
                          type: string
                      required:
                      - subtotal_cents
                      - tax_cents
                      - total_cents
                      - paid_cents
                      - remaining_cents
                      - currency
                    url:
                      type: string
                    app_url:
                      type: string
                    location:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        url:
                          type: string
                      required:
                      - id
                      - name
                      - url
                  required:
                  - type
                  - id
                  - work_order_number
                  - status
                  - intake_method
                  - scheduled_for
                  - authorized
                  - paid
                  - created_at
                  - updated_at
                  - closed_at
                  - location_id
                  - service_advisor_id
                  - assigned_technician_id
                  - work_order_services_count
                  - inspection_reports_count
                  - customer
                  - vehicle
                  - totals
                  - url
                  - app_url
                  - location
      description:
      operationId: get_customers_work_order
      x-curl-example: 'curl -H "User-Agent: wenmar-cli/0.2" -H "Authorization: Bearer
        $WENMAR_TOKEN" https://app.wenmarpro.com/customers/{customer_id}/work_orders.json'
      x-retry: *1
  "/customers/{id}":
    delete:
      summary: destroy
      tags:
      - customers
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: DELETE /customers/{id} -> 202
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        '403':
          description: DELETE /customers/{id} -> 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    "$ref": "#/components/schemas/Error"
                required:
                - error
        '422':
          description: DELETE /customers/{id} -> 422
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    "$ref": "#/components/schemas/Error"
                required:
                - error
      description: Delete a customer by ID.
      operationId: delete_customer
      x-curl-example: 'curl -X DELETE -H "User-Agent: wenmar-cli/0.2" -H "Authorization:
        Bearer $WENMAR_TOKEN" https://app.wenmarpro.com/customers/<id>.json'
      x-retry: *1
    get:
      summary: show
      tags:
      - customers
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: GET /customers/{id} -> 200
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        '404':
          description: GET /customers/{id} -> 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    "$ref": "#/components/schemas/Error"
                required:
                - error
      description: Show a customer by ID.
      operationId: show_customer
      x-curl-example: 'curl -H "User-Agent: wenmar-cli/0.2" -H "Authorization: Bearer
        $WENMAR_TOKEN" https://app.wenmarpro.com/customers/<id>.json'
      x-retry: *1
    patch:
      summary: update
      tags:
      - customers
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: object
                  properties:
                    phones_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          _destroy:
                            type: boolean
                        required:
                        - id
                        - _destroy
                    emails_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            nullable: true
                          email:
                            type: string
                          label:
                            type: string
                            nullable: true
                        required:
                        - email
              required:
              - customer
      responses:
        '200':
          description: PATCH /customers/{id} -> 200
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
      description: Update a customer by ID.
      operationId: update_customer
      x-curl-example: |-
        curl -X PATCH -H "User-Agent: wenmar-cli/0.2" -H "Authorization: Bearer $WENMAR_TOKEN" -H "Content-Type: application/json" \
             -d '{"...":"..."}' https://app.wenmarpro.com/customers/<id>.json
      x-retry: *1
  "/locations/{id}":
    get:
      summary: show
      tags:
      - locations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: GET /locations/{id} -> 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  location_type:
                    type: string
                  currency:
                    type: string
                  dock:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        enabled:
                          type: boolean
                        url:
                          type: string
                          nullable: true
                      required:
                      - name
                      - enabled
                      - url
                  url:
                    type: string
                  app_url:
                    type: string
                required:
                - id
                - name
                - location_type
                - currency
                - dock
                - url
                - app_url
        '403':
          description: GET /locations/{id} -> 403
          content:
            application/json:
              schema:
