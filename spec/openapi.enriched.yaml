        $WENMAR_TOKEN" https://app.wenmarpro.com/customers.json'
      x-paginated: true
      x-pagination-header: Link
      x-pagination-format: rfc5988
      x-retry:
        max: 3
        backoff: exponential
        retry-on:
        - 429
        - 500
        - 502
        - 503
        - 504
        method-gated: true
    post:
      summary: create
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: object
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    company_name:
                      type: string
                    fleet_identifier:
                      type: string
                    billing_terms:
                      type: string
                    credit_limit_cents:
                      type: string
                    tax_exempt:
                      type: boolean
                    tax_exempt_number:
                      type: string
                    notes:
                      type: string
                    marketing_opt_in:
                      type: boolean
                    discount_percent:
                      type: string
                    po_required:
                      type: boolean
                    tag_ids:
                      type: array
                      items: {}
                    emails_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          email:
                            type: string
                          label:
                            type: string
                          primary:
                            type: boolean
                        required:
                        - email
                        - label
                        - primary
                    phones_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          number:
                            type: string
                          label:
                            type: string
                          primary:
                            type: boolean
                        required:
                        - number
                        - label
                        - primary
                    addresses_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          address1:
                            type: string
                          city:
                            type: string
                          state:
                            type: string
                          postal_code:
                            type: string
                          country:
                            type: string
                          is_billing:
                            type: boolean
                        required:
                        - address1
                        - city
                        - state
                        - postal_code
                        - country
                        - is_billing
                  required:
                  - first_name
                  - last_name
              required:
              - customer
      responses:
        '201':
          description: POST /customers -> 201
