  "/vehicles/vin_decode":
    get:
      summary: vin_decode
      tags:
      - vehicles
      parameters:
      - name: vin
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: GET /vehicles/vin_decode -> 200
          content:
            application/json:
              schema:
