# Fixture-coverage manifest.
#
# Guarantees every operation's response schema has at least one live,
# validated representative among the shared JSON fixtures, so a new required
# field added to a response schema forces a fixture to carry it.
#
# Enforced by scripts/check_fixture_coverage.rb (wired into CI).
#
# Each `targets` entry is one of:
#   operation entry — { id, operation: <operationId>, fixture: <path> }
#     Validates the COMPLETE response body of `operation` (the response body is
#     the bare resource — no data envelope) against the fixture named by
#     `fixture`.
#   pointer entry    — { id, fixture, pointer, schema }
#     Validates the object selected by JSON pointer `pointer` within `fixture`
#     against the named inline schema. `pointer: ""` selects the whole document.

targets:
  - id: customer-get
    operation: show_customer
    fixture: customers/get.json
  - id: customer-list
    operation: list_customers
    fixture: customers/list.json
  - id: customer-create
    operation: create_customer
    fixture: customers/get.json
  - id: customer-update
    operation: update_customer
    fixture: customers/get.json
  - id: vehicle-get
    operation: show_vehicle
    fixture: vehicles/get.json
  - id: vehicle-list
    operation: list_vehicles
    fixture: vehicles/list.json
  - id: vehicle-create
    operation: create_vehicle
    fixture: vehicles/get.json
  - id: vehicle-update
    operation: update_vehicle
    fixture: vehicles/get.json
  - id: work-order-get
    operation: show_work_order
    fixture: work_orders/get.json
  - id: work-order-list
    operation: list_work_orders
    fixture: work_orders/list.json
  - id: work-order-create
    operation: create_work_order
    fixture: work_orders/get.json
  - id: work-order-update
    operation: update_work_order
    fixture: work_orders/get.json
  - id: work-order-estimate
    operation: show_work_order_estimate
    fixture: work_orders/estimate.json
  - id: work-order-wip
    operation: show_work_order_wip
    fixture: work_orders/wip.json
  - id: work-order-inspection
    operation: show_work_order_inspection
    fixture: work_orders/inspection.json
  - id: work-order-parts
    operation: show_work_order_parts
    fixture: work_orders/parts.json
  - id: work-order-payments
    operation: show_work_order_payments
    fixture: work_orders/payments.json
  - id: driver-get
    operation: show_driver
    fixture: drivers/get.json
  - id: driver-list
    operation: list_customers_drivers
    fixture: drivers/list.json
  - id: driver-create
    operation: create_driver
    fixture: drivers/get.json
  - id: driver-update
    operation: update_driver
    fixture: drivers/get.json
  - id: statement-get
    operation: show_statement
    fixture: statements/get.json
  - id: statement-list
    operation: list_customers_statements
    fixture: statements/list.json
  - id: vendor-get
    operation: show_vendor
    fixture: vendors/get.json
  - id: vendor-list
    operation: list_vendors
    fixture: vendors/list.json
  - id: account-get
    operation: list_account
    fixture: account/get.json
  - id: location-get
    operation: show_location
    fixture: locations/get.json
  - id: customer-merge
    operation: merge_customer
    fixture: customers/merge_response.json
  - id: vehicle-transfer
    operation: transfer_vehicle
    fixture: vehicles/transfer_response.json
  - id: vehicle-merge
    operation: merge_vehicle
    fixture: vehicles/merge_response.json
  - id: tags-list
    operation: list_tags
    fixture: tags/list.json
  - id: customer-lookup
    operation: lookup_customer
    fixture: customers/lookup.json
  - id: vehicle-lookup
    operation: lookup_vehicle
    fixture: vehicles/lookup.json
  - id: vehicle-prefill
    operation: prefill_vehicle
    fixture: vehicles/prefill.json
  - id: service-category-list
    operation: list_service_categories
    fixture: service_categories/list.json
  - id: service-category-create
    operation: create_service_category
    fixture: service_categories/get.json

covered_schemas:
  customer: [customer-get, customer-list, customer-create, customer-update]
  vehicle: [vehicle-get, vehicle-list, vehicle-create, vehicle-update]
  work_order: [work-order-get, work-order-list, work-order-create, work-order-update]
  driver: [driver-get, driver-list, driver-create, driver-update]
  statement: [statement-get, statement-list]
  vendor: [vendor-get, vendor-list]
  service_category: [service-category-list, service-category-create]
  account: [account-get]
  location: [location-get]
