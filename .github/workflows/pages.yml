name: Deploy Scalar API Reference

on:
  push:
    branches: [main]
    paths:
      - "spec/openapi.enriched.yaml"
      - "docs/scalar/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy enriched spec into scalar dir
        run: cp spec/openapi.enriched.yaml docs/scalar/openapi.enriched.yaml

      - name: Build
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/scalar

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4