name: SDK Generate & Verify

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "spec/openapi.yaml"
      - "scripts/**"
      - "overlays/**"
      - "go/**"
      - "ruby/**"
      - "conformance/**"
      - ".github/workflows/sdk-generate.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate spec is OpenAPI 3.0
        run: |
          version=$(ruby -ryaml -e 'puts YAML.load_file("spec/openapi.yaml")["openapi"]')
          echo "openapi version: $version"
          test "${version#3.0}" != "$version"

      - name: Enrich spec
        run: ruby scripts/enrich_spec.rb spec/openapi.yaml spec/openapi.enriched.yaml

      - name: Generate API docs
        run: ruby scripts/generate_docs.rb spec/openapi.enriched.yaml docs/api spec/fixtures

      - name: Regenerate Go client
        run: go generate ./...
        working-directory: go

      - name: Build Go SDK
        run: go build ./...
        working-directory: go

      - name: Test Go SDK
        run: go test ./...
        working-directory: go

      - name: Go conformance
        run: go test ./...
        working-directory: conformance/go

      - name: Ruby SDK tests
        run: |
          bundle install
          bundle exec ruby -Ilib spec/client_spec.rb
          bundle exec ruby -Ilib spec/pagination_spec.rb
        working-directory: ruby

      - name: Ruby conformance
        run: bundle install && bundle exec ruby conformance_spec.rb
        working-directory: conformance/ruby

      - name: Fixture coverage
        run: ruby scripts/check_fixture_coverage.rb

      - name: Doc generator tests
        run: ruby scripts/generate_docs_test.rb

      - name: Verify no drift in generated Go client
        run: |
          go generate ./...
          git diff --exit-code -- pkg/generated/client.gen.go
        working-directory: go

      - name: Verify no drift in generated API docs
        run: |
          ruby scripts/generate_docs.rb spec/openapi.enriched.yaml docs/api spec/fixtures
          git diff --exit-code -- docs/api/sections/ docs/api/api-reference.md docs/api/llm-compact.md
