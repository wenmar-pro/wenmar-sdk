name: SDK Generate & Verify

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "spec/openapi.yaml"
      - "scripts/**"
      - "overlays/**"
      - "go/**"
      - "ruby/**"
      - "conformance/**"
      - "Makefile"
      - ".github/workflows/sdk-generate.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go/go.sum

      - uses: actions/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby SDK gems
        run: bundle install
        working-directory: ruby

      - name: Install Ruby conformance gems
        run: bundle install
        working-directory: conformance/ruby

      - name: Validate spec is OpenAPI 3.0
        run: |
          version=$(ruby -ryaml -e 'puts YAML.load_file("spec/openapi.yaml")["openapi"]')
          echo "openapi version: $version"
          test "${version#3.0}" != "$version"

      # make check is the single source of truth: enrich, generate, docs,
      # Go/Ruby unit tests, both conformance suites, parity checks, fixture
      # coverage, and generated-file drift.
      - name: Full check
        run: make check
