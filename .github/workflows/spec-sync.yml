name: Spec Sync

on:
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # Check for spec updates every 6 hours

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Fetch latest spec from wenmar-api
        run: |
          git clone --depth 1 https://github.com/wenmar-pro/wenmar-api.git /tmp/wenmar-api
          cp /tmp/wenmar-api/spec/openapi.yaml spec/openapi.yaml

      - name: Check if spec changed
        id: changed
        run: |
          if git diff --quiet spec/openapi.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Enrich spec
        if: steps.changed.outputs.changed == 'true'
        run: ruby scripts/enrich_spec.rb spec/openapi.yaml spec/openapi.enriched.yaml

      - name: Validate enriched spec is OpenAPI 3.0
        if: steps.changed.outputs.changed == 'true'
        run: |
          version=$(ruby -ryaml -e 'puts YAML.load_file("spec/openapi.enriched.yaml")["openapi"]')
          echo "openapi version: $version"
          test "${version#3.0}" != "$version"

      - name: Run fixture coverage
        if: steps.changed.outputs.changed == 'true'
        run: ruby scripts/check_fixture_coverage.rb

      - name: Commit synced spec
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "wenmar-sdk-ci"
          git config user.email "ci@wenmarpro.com"
          git add spec/openapi.yaml spec/openapi.enriched.yaml
          git commit -m "chore: sync openapi.yaml from wenmar-api"
          git push

      - name: Comment if generation is needed
        if: steps.changed.outputs.changed == 'true'
        run: echo "::warning::Spec updated — the sdk-generate workflow will regenerate SDKs"
