<!doctype html>
<html>
  <head>
    <title>Wenmar Pro API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Wenmar Pro API — interactive reference powered by Scalar" />
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@latest"></script>
    <script>
      Scalar.createApiReference("#app", {
        spec: { url: "openapi.enriched.yaml" },
        layout: "modern",
        hideModels: false,
        darkMode: true,
        searchHotKey: "cmd+k",
        hideSearchButton: false,
        hideSidebar: false,
        hideTestRequestButton: false,
        defaultOpenAllTags: false,
        hideSidebarTopBar: false,
        scalar_git_url: "https://github.com/Wenmar-Pro/wenmar-sdk",
      });
    </script>
  </body>
</html>
